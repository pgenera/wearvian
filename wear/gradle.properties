# 3 GiB: enough heap for R8 (it heap-OOMs at 2 GiB on this Compose app) but low enough that the
# build JVM's peak fits in available RAM on this 16 GB / no-swap host — 4 GiB let R8 spike past
# free RAM and the OS OOM-killed the build.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# No persistent daemon: each build runs in a single-use JVM that exits when done, so the 4 GiB
# heap isn't held resident between builds (trades a few seconds of JVM startup for freed RAM).
org.gradle.daemon=false
# Compile Kotlin in the (single-use) Gradle JVM instead of spawning a separate KotlinCompileDaemon.
# That daemon lingers with its own -Xmx4096m for ~2h after a build and starved R8 into an OOM-kill
# on this low-RAM, no-swap host. In-process = one JVM that exits when the build ends.
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
