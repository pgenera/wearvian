# 3 GiB heap covers Gradle + Kotlin (in-process) + R8. R8 (release minify) is the memory-hungry
# step and sets this floor (it heap-OOMs at 2 GiB on this Compose app). This host has 7.3 GiB total
# RAM and NO swap, so a resident daemon at -Xmx3072m (~3.5 GiB with JVM overhead) is ~half of RAM
# and leaves ~3.8 GiB for the OS — a reasonable amount. Going to 4 GiB has let R8 spike past free
# RAM and get OOM-killed on this no-swap host, so don't.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# Keep the daemon resident between builds for fast warm rebuilds. The idle timeout drops it after
# 1 h so it doesn't pin ~3.5 GiB indefinitely on this no-swap host. Both wearvian projects (watch +
# companion) use IDENTICAL jvmargs so they share ONE daemon instead of spawning two that would
# together exceed RAM.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000
# Compile Kotlin inside the resident Gradle daemon, not a separate KotlinCompileDaemon. On this
# low-RAM, no-swap host a second resident JVM (with its own -Xmx) alongside the daemon risks an
# OOM-kill; in-process keeps it to a single JVM whose 3 GiB heap covers Kotlin compile and R8 both.
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
