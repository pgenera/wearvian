# Host: ~14 GiB RAM + 4 cores, NO swap. Heap covers Gradle + Kotlin (in-process) + R8; R8 (release
# minify) is the memory-hungry step. 6 GiB gives R8 generous headroom (less GC) while the resident
# daemon (~6.5 GiB with JVM overhead) still leaves ~7 GiB for the OS. Both wearvian projects use
# IDENTICAL jvmargs so they share ONE daemon.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
# Keep the daemon resident between builds for fast warm rebuilds; idle timeout drops it after 1 h.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000
# Build independent projects/tasks concurrently across the 4 cores.
org.gradle.parallel=true
# Compile Kotlin inside the (resident, warm) Gradle daemon. RAM now allows a separate KotlinCompileDaemon
# if ever wanted, but in-process keeps it to one JVM and the resident daemon already stays warm for
# incremental builds.
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
